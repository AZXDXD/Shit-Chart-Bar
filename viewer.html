<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Viewer — Calamity Fortune — 大份吧</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a10; --bg2:#13131f; --bg3:#1a1a2e;
      --border:#2a2a44; --border-b:#3a3a60;
      --orange:#ff6f00; --orange-l:#ffa040; --oglow:rgba(255,111,0,.4);
      --purple:#b04dff; --blue:#3de4ff; --green:#22c55e;
      --text:#eaeaf0; --dim:#8888aa; --dimmer:#55556a;
    }
    html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI','Noto Sans TC',sans-serif; }

    /* ── TOP BAR ── */
    #topBar {
      position:fixed; top:0; left:0; right:0; z-index:100;
      height:52px; background:rgba(10,10,16,.92); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 16px; gap:12px;
    }
    .logo-sm { display:flex; align-items:center; gap:7px; text-decoration:none; flex-shrink:0; }
    .logo-icon { width:28px; height:28px; background:linear-gradient(135deg,var(--orange),var(--purple)); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:#fff; box-shadow:0 0 12px var(--oglow); }
    .logo-text { font-size:15px; font-weight:900; background:linear-gradient(90deg,var(--orange-l),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .song-info { flex:1; min-width:0; }
    .song-title { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-meta { font-size:11px; color:var(--dim); display:flex; align-items:center; gap:8px; }
    .diff-pill { display:inline-block; padding:1px 7px; border-radius:4px; font-size:10px; font-weight:800; background:#4a1a7a; color:#d59fff; border:1px solid #7d3c98; }
    .top-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .icon-btn { width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,.06); border:1px solid var(--border-b); color:var(--dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:all .2s; flex-shrink:0; }
    .icon-btn:hover { color:var(--text); border-color:var(--orange-l); }
    .icon-btn.active { background:rgba(255,111,0,.12); border-color:var(--orange); color:var(--orange-l); }

    /* ── MAIN CANVAS AREA ── */
    #canvasWrap {
      position:fixed; top:52px; left:0; right:300px; bottom:148px;
      background:#000; overflow:hidden; transition:right .3s;
    }
    #canvasWrap.panel-hidden { right:0; }
    #viewerCanvas { display:block; width:100%; height:100%; }
    #canvas3dWrap {
      position:absolute; inset:0; display:none;
      perspective:600px; align-items:flex-end; justify-content:center;
    }
    #canvas3dWrap.show { display:flex; }
    #viewer3dCanvas { display:block; transform-origin:bottom center; }

    /* ── RIGHT PANEL ── */
    #rightPanel {
      position:fixed; top:52px; right:0; bottom:148px; width:300px;
      background:var(--bg2); border-left:1px solid var(--border);
      overflow-y:auto; transition:transform .3s;
    }
    #rightPanel.hidden { transform:translateX(300px); }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border-b); border-radius:2px; }

    .panel-section { padding:16px; border-bottom:1px solid var(--border); }
    .panel-title { font-size:11px; font-weight:700; color:var(--dimmer); letter-spacing:.8px; text-transform:uppercase; margin-bottom:12px; }

    /* Speed buttons */
    .speed-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .speed-btn { padding:7px 0; border-radius:7px; font-size:12px; font-weight:700; text-align:center; cursor:pointer; background:rgba(255,255,255,.05); border:1px solid var(--border-b); color:var(--dim); transition:all .2s; }
    .speed-btn:hover { border-color:var(--orange-l); color:var(--orange-l); }
    .speed-btn.active { background:rgba(255,111,0,.15); border-color:var(--orange); color:var(--orange-l); box-shadow:0 0 8px var(--oglow); }

    /* Hi-speed slider */
    .hs-row { display:flex; align-items:center; gap:10px; }
    .hs-slider { -webkit-appearance:none; flex:1; height:4px; background:var(--border-b); border-radius:2px; outline:none; cursor:pointer; }
    .hs-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--oglow); cursor:pointer; }
    .hs-val { font-size:14px; font-weight:900; color:var(--orange-l); min-width:30px; text-align:right; }

    /* Sound toggles */
    .sound-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
    .sound-label { font-size:13px; color:var(--dim); }
    .toggle { position:relative; width:36px; height:19px; flex-shrink:0; }
    .toggle input { opacity:0; width:0; height:0; }
    .tog-slider { position:absolute; inset:0; background:var(--border-b); border-radius:19px; transition:.3s; cursor:pointer; }
    .tog-slider::before { content:''; position:absolute; width:13px; height:13px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.3s; }
    .toggle input:checked + .tog-slider { background:var(--orange); }
    .toggle input:checked + .tog-slider::before { transform:translateX(17px); }

    /* View mode */
    .view-row { display:flex; gap:6px; }
    .view-btn { flex:1; padding:8px; border-radius:8px; font-size:12px; font-weight:700; text-align:center; cursor:pointer; background:rgba(255,255,255,.05); border:1px solid var(--border-b); color:var(--dim); transition:all .2s; }
    .view-btn:hover { border-color:var(--orange-l); color:var(--orange-l); }
    .view-btn.active { background:rgba(255,111,0,.15); border-color:var(--orange); color:var(--orange-l); }

    /* Mirror + BG */
    .opt-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; color:var(--dim); }

    /* Measure jump */
    .measure-row { display:flex; gap:8px; }
    .measure-input { flex:1; background:var(--bg3); border:1px solid var(--border-b); color:var(--text); padding:8px 12px; border-radius:8px; font-size:14px; font-weight:700; outline:none; }
    .measure-input:focus { border-color:var(--orange); }
    .btn-jump { background:var(--orange); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; }
    .btn-jump:hover { background:var(--orange-l); }

    /* Measure markers */
    #measureList { display:flex; flex-direction:column; gap:4px; }
    .measure-marker { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; transition:all .15s; }
    .measure-marker:hover { background:rgba(255,255,255,.06); }
    .measure-marker.current { background:rgba(255,111,0,.1); }
    .m-num { font-size:11px; font-weight:800; color:var(--dimmer); min-width:28px; }
    .m-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
    .m-bar-fill { height:100%; background:var(--orange); border-radius:2px; transition:width .1s; }
    .m-label { font-size:10px; color:var(--dimmer); }

    /* ── BOTTOM CONTROLS ── */
    #bottomBar {
      position:fixed; bottom:0; left:0; right:0; height:148px; z-index:100;
      background:rgba(10,10,16,.95); backdrop-filter:blur(16px);
      border-top:1px solid var(--border);
      display:flex; flex-direction:column; padding:12px 20px 14px;
    }

    /* Seek bar */
    .seekbar-wrap { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .time-label { font-size:12px; font-weight:700; color:var(--dim); white-space:nowrap; min-width:38px; font-variant-numeric:tabular-nums; }
    #seekBar { -webkit-appearance:none; flex:1; height:5px; background:var(--border-b); border-radius:3px; outline:none; cursor:pointer; position:relative; }
    #seekBar::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--orange); box-shadow:0 0 10px var(--oglow); cursor:pointer; }
    .measure-ticks { position:relative; flex:1; height:8px; margin:0 0 0 48px; }
    .tick { position:absolute; top:0; width:1px; height:8px; background:rgba(255,255,255,.15); }
    .tick.beat { background:rgba(255,255,255,.3); }
    .tick-label { position:absolute; top:10px; font-size:9px; color:var(--dimmer); transform:translateX(-50%); white-space:nowrap; }

    /* Main controls */
    .controls-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .ctrl-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--border-b); background:rgba(255,255,255,.06); color:var(--dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; transition:all .2s; flex-shrink:0; }
    .ctrl-btn:hover { color:var(--text); border-color:var(--orange-l); }
    .ctrl-btn.play { width:48px; height:48px; background:linear-gradient(135deg,var(--orange),#e05500); color:#fff; border:none; font-size:20px; box-shadow:0 0 16px var(--oglow); border-radius:50%; }
    .ctrl-btn.play:hover { transform:scale(1.05); box-shadow:0 0 24px var(--oglow); }
    .ctrl-sep { width:1px; height:32px; background:var(--border); flex-shrink:0; }

    /* Speed display in controls */
    .speed-display { font-size:13px; font-weight:800; color:var(--orange-l); background:rgba(255,111,0,.1); border:1px solid rgba(255,111,0,.25); padding:5px 12px; border-radius:7px; cursor:pointer; transition:all .2s; }
    .speed-display:hover { background:rgba(255,111,0,.2); }

    /* Note legend */
    .legend { display:flex; align-items:center; gap:14px; margin-left:auto; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--dimmer); }
    .legend-dot { width:12px; height:6px; border-radius:2px; }

    /* ── 3D OVERLAY ── */
    #overlay3d {
      position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 40%);
    }

    /* ── FULLSCREEN NOTICE ── */
    #fsBtn { font-size:14px; }

    /* ── LOADING / PAUSED OVERLAY ── */
    #pauseOverlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; opacity:0; transition:opacity .3s;
    }
    #pauseOverlay.show { opacity:1; }
    .pause-icon { font-size:80px; filter:drop-shadow(0 0 20px rgba(255,111,0,.6)); }
  .account-link { display:inline-flex;align-items:center;gap:8px;min-width:0;color:inherit;text-decoration:none;cursor:pointer; }
.account-link:hover { opacity:.8; }
.account-link:focus-visible { outline:2px solid var(--orange);outline-offset:4px; }
</style>
<script defer src="js/login-controls.js"></script>
<script type="module" src="js/auth.js"></script>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<div id="topBar">
  <a class="logo-sm" href="index.html">
    <div class="logo-icon">大</div>
    <span class="logo-text">大份吧</span>
  </a>
  <div style="width:1px;height:24px;background:var(--border);flex-shrink:0;"></div>
  <div class="song-info">
    <div class="song-title">Calamity Fortune</div>
    <div class="song-meta">
      <span class="diff-pill">MASTER 15.0</span>
      xi &nbsp;·&nbsp; Chart by 七瀬 &nbsp;·&nbsp; BPM 220
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" title="返回詳情頁" onclick="history.back()">←</button>
    <button class="icon-btn" data-auth="guest" onclick="openLoginModal()">登入</button><span data-auth="user" style="display:none;align-items:center;gap:8px;max-width:220px;">
  <a class="account-link" data-account-link href="charter_studio.html#profile" aria-label="我的帳號"><img data-user="avatar" alt="使用者頭像" referrerpolicy="no-referrer" style="display:none;width:28px;height:28px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">
  <span data-user="name" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  </a><button class="btn-login" onclick="event.stopPropagation();logout()">登出</button>
</span><button class="icon-btn" id="panelToggleBtn" title="顯示/隱藏設定面板" onclick="togglePanel()">⚙</button>
    <button class="icon-btn" id="fsBtn" title="全螢幕" onclick="toggleFullscreen()">⛶</button>
    <button class="icon-btn" title="下載譜面包" style="color:var(--orange-l);border-color:rgba(255,111,0,.3);">📦</button>
  </div>
</div>

<!-- ══ CANVAS (2D) ══ -->
<div id="canvasWrap">
  <canvas id="viewerCanvas"></canvas>
  <!-- 3D wrap overlay -->
  <div id="canvas3dWrap">
    <canvas id="viewer3dCanvas"></canvas>
    <div id="overlay3d"></div>
  </div>
  <div id="pauseOverlay">
    <div class="pause-icon">⏸</div>
  </div>
</div>

<!-- ══ RIGHT PANEL ══ -->
<div id="rightPanel">

  <!-- View Mode -->
  <div class="panel-section">
    <div class="panel-title">🖥 視角模式</div>
    <div class="view-row">
      <button class="view-btn active" id="view2d" onclick="setView('2d')">2D 平面捲動</button>
      <button class="view-btn" id="view3d" onclick="setView('3d')">3D 機台視角</button>
    </div>
  </div>

  <!-- Display Options -->
  <div class="panel-section">
    <div class="panel-title">⚙ 顯示設定</div>
    <div class="opt-row">
      <span>🪞 鏡像翻轉 (Mirror)</span>
      <label class="toggle"><input type="checkbox" id="mirrorToggle" onchange="renderer.mirror=this.checked"><div class="tog-slider"></div></label>
    </div>
    <div class="opt-row">
      <span>🌌 曲繪模糊背景</span>
      <label class="toggle"><input type="checkbox" id="bgToggle" onchange="toggleBg(this.checked)" checked><div class="tog-slider"></div></label>
    </div>
    <div class="opt-row">
      <span>📏 顯示小節線</span>
      <label class="toggle"><input type="checkbox" id="measureLineToggle" onchange="renderer.showMeasureLines=this.checked" checked><div class="tog-slider"></div></label>
    </div>
    <div style="margin-top:12px;">
      <div class="panel-title" style="margin-bottom:8px;">⚡ Hi-Speed（音符下落速度）</div>
      <div class="hs-row">
        <input class="hs-slider" type="range" min="1" max="20" value="8" id="hsSlider" oninput="updateHiSpeed(this.value)">
        <span class="hs-val" id="hsVal">×8.0</span>

  <!-- Sound FX -->
  <div class="panel-section">
    <div class="panel-title">🔊 打擊音效</div>
    <div class="sound-row">
      <span class="sound-label">🟧 Tap 音效</span>
      <label class="toggle"><input type="checkbox" id="sfxTap" checked><div class="tog-slider"></div></label>

    <div class="sound-row">
      <span class="sound-label">🔵 Air 音效</span>

    </div>
    <div class="sound-row">
      <span class="sound-label">🟣 Slide 音效</span>
      <label class="toggle"><input type="checkbox" id="sfxSlide" checked><div class="tog-slider"></div></label>
    </div>
    <div class="sound-row">
      <span class="sound-label">🎵 背景音源</span>
      <label class="toggle"><input type="checkbox" id="sfxBgm" checked><div class="tog-slider"></div></label>
    </div>

  <!-- Measure Jump -->
  <div class="panel-section">
    <div class="panel-title">📍 小節快速跳轉</div>

      <input class="measure-input" type="number" id="measureJumpInput" min="1" max="128" placeholder="小節數">
      <button class="btn-jump" onclick="jumpToMeasure()">跳轉</button>

    <div id="measureList"></div>

  <!-- Playback Speed -->
  <div class="panel-section">
    <div class="panel-title">🐢 播放倍速</div>

      <button class="speed-btn" data-speed="0.25" onclick="setSpeed(0.25)">0.25×</button>
      <button class="speed-btn" data-speed="0.5"  onclick="setSpeed(0.5)">0.50×</button>
      <button class="speed-btn" data-speed="0.75" onclick="setSpeed(0.75)">0.75×</button>
      <button class="speed-btn active" data-speed="1"    onclick="setSpeed(1)">1.00×</button>
      <button class="speed-btn" data-speed="1.25" onclick="setSpeed(1.25)">1.25×</button>
      <button class="speed-btn" data-speed="1.5"  onclick="setSpeed(1.5)">1.50×</button>
    </div>
  </div>

</div><!-- /rightPanel -->

<!-- ══ BOTTOM BAR ══ -->
<div id="bottomBar">

  <!-- Seek bar row -->
  <div class="seekbar-wrap">
    <span class="time-label" id="timeNow">0:00</span>
    <input type="range" id="seekBar" min="0" max="1000" value="0" oninput="onSeek(this.value)">
    <span class="time-label" id="timeTotal">2:18</span>
  </div>

  <!-- Tick marks -->
  <div style="display:flex;align-items:flex-end;gap:0;margin-bottom:8px;padding:0 48px;">
    <div class="measure-ticks" id="measureTicks"></div>
  </div>

  <!-- Controls row -->
  <div class="controls-row">
    <!-- Playback -->
    <button class="ctrl-btn" title="快退 5s" onclick="skipTime(-5)">⏮</button>
    <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" title="快進 5s" onclick="skipTime(5)">⏭</button>
    <div class="ctrl-sep"></div>
    <!-- Speed -->
    <span class="speed-display" id="speedDisplay" onclick="cycleSpeed()">1.00×</span>
    <div class="ctrl-sep"></div>
    <!-- Current measure display -->
    <div style="font-size:12px;color:var(--dim);">小節 <strong id="currentMeasure" style="color:var(--text);font-size:15px;font-variant-numeric:tabular-nums;">1</strong> / <span style="color:var(--dimmer);">128</span></div>
    <div class="ctrl-sep"></div>
    <!-- Note type legend -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#ff9040;height:8px;border:1px solid #ff6f00;"></div>TAP</div>
      <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(to bottom,rgba(176,77,255,.9),rgba(176,77,255,.3));height:20px;width:8px;border-radius:2px;"></div>HOLD</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3de4ff;clip-path:polygon(50% 0%,100% 100%,0% 100%);width:10px;height:10px;border-radius:0;"></div>AIR</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff3daa;height:8px;border:1px solid #ff3daa;"></div>FLICK</div>
      <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(90deg,#ff6f00,#b04dff);height:8px;width:20px;"></div>SLIDE</div>
    </div>
    <!-- FPS -->
    <div style="margin-left:auto;font-size:11px;color:var(--dimmer);" id="fpsDisplay">60 fps</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// NOTE DATA — Simulated Chunithm Chart
// ══════════════════════════════════════════
// Each note: { type, lane(0-15), width(1-16), beat, duration(for hold) }
// beat is in 1/48 resolution, 1 measure = 192 units
const BEATS_PER_MEASURE = 192;
const BPM = 220;
const TOTAL_MEASURES = 128;
const TOTAL_BEATS = TOTAL_MEASURES * BEATS_PER_MEASURE;

function gen(type,lane,w,beat,dur=0){ return {type,lane,w,beat,dur}; }

const NOTES = [];
// Generate a realistic-looking Chunithm chart
(function(){
  const patterns = [
    // Full-width tap
    ()=>gen('tap',0,16,0),
    // Streams of taps
    (b)=>{ for(let i=0;i<8;i++) NOTES.push(gen('tap',i*2,2,b+i*24)); },
    // Hold
    (b)=>gen('hold',4,8,b,96),
    // Air
    (b)=>gen('air',6,4,b),
    // Flick
    (b)=>gen('flick',2,4,b),
    // Slide
    (b)=>gen('slide',0,8,b),
    // Dense stream
    (b)=>{ for(let i=0;i<16;i++) NOTES.push(gen('tap',i,1,b+i*12)); },
  ];

  for(let m=0;m<TOTAL_MEASURES;m++){
    const base = m * BEATS_PER_MEASURE;
    const density = (m%8<4) ? 'medium' : 'dense';

    // TAP notes — varied patterns
    const tapPattern = m % 6;
    if(tapPattern===0){
      // 4-beat pattern
      for(let i=0;i<4;i++) NOTES.push(gen('tap',(i*4)%16,4,base+i*48));
    } else if(tapPattern===1){
      // Cross
      for(let i=0;i<8;i++) NOTES.push(gen('tap',i%2===0?0:12,4,base+i*24));
    } else if(tapPattern===2){
      // Wide taps
      NOTES.push(gen('tap',0,8,base));
      NOTES.push(gen('tap',8,8,base+96));
    } else if(tapPattern===3){
      // Dense 16th
      for(let i=0;i<8;i++) NOTES.push(gen('tap',i*2,2,base+i*24));
      for(let i=0;i<8;i++) NOTES.push(gen('tap',(15-i*2),2,base+96+i*24));
    } else if(tapPattern===4){
      // Staircase
      for(let i=0;i<8;i++) NOTES.push(gen('tap',i,2,base+i*24));
    } else {
      // Full chord
      NOTES.push(gen('tap',0,16,base));
      NOTES.push(gen('tap',0,16,base+96));
    }

    // HOLD notes every 4 measures
    if(m%4===0) NOTES.push(gen('hold',4+(m%4)*2,4,base,BEATS_PER_MEASURE*2-12));
    if(m%4===2) NOTES.push(gen('hold',2,6,base,BEATS_PER_MEASURE-12));

    // AIR notes
    if(m%2===0) NOTES.push(gen('air',6,4,base+48));
    if(m%3===0){ NOTES.push(gen('air',0,4,base+96)); NOTES.push(gen('air',12,4,base+96)); }

    // FLICK notes
    if(m%3===1) NOTES.push(gen('flick',6,4,base+144));

    // SLIDE notes
    if(m%5===0) NOTES.push(gen('slide',2,12,base+24));
    if(m%7===0) NOTES.push(gen('slide',0,8,base+72));
  }
  NOTES.sort((a,b)=>a.beat-b.beat);
})();

// ══════════════════════════════════════════
// RENDERER STATE
// ══════════════════════════════════════════
const renderer = {
  playing: false,
  currentBeat: 0,
  speed: 1,
  hiSpeed: 8,
  mirror: false,
  showMeasureLines: true,
  view: '2d',
  bgEnabled: true,
  lastTime: null,
  frameCount: 0,
  fps: 60,
  fpsTimer: 0,
};

// Beats per second at BPM
function bps(){ return BPM/60 * BEATS_PER_MEASURE/4; }

// ══════════════════════════════════════════
// CANVAS SETUP
// ══════════════════════════════════════════
const canvas2d = document.getElementById('viewerCanvas');
const ctx2d = canvas2d.getContext('2d');
const canvas3d = document.getElementById('viewer3dCanvas');
const ctx3d = canvas3d.getContext('2d');

function resize(){
  const wrap = document.getElementById('canvasWrap');
  canvas2d.width = wrap.clientWidth;
  canvas2d.height = wrap.clientHeight;
  canvas3d.width = wrap.clientWidth;
  canvas3d.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ══════════════════════════════════════════
// NOTE COLORS
// ══════════════════════════════════════════
const NOTE_COLORS = {
  tap:   { fill:'#ff9040', border:'#ff6000', glow:'rgba(255,130,0,.5)' },
  hold:  { fill:'rgba(176,77,255,.85)', border:'#b04dff', glow:'rgba(176,77,255,.4)' },
  holdBody: { fill:'rgba(176,77,255,.25)', border:'rgba(176,77,255,.5)' },
  air:   { fill:'#3de4ff', border:'#00c8e8', glow:'rgba(61,228,255,.6)' },
  flick: { fill:'#ff3daa', border:'#cc0077', glow:'rgba(255,61,170,.5)' },
  slide: { fill:'linear', border:'#b04dff', glow:'rgba(255,111,0,.3)' },
};

// ══════════════════════════════════════════
// 2D RENDER
// ══════════════════════════════════════════
function draw2d(){
  const W = canvas2d.width, H = canvas2d.height;
  const ctx = ctx2d;
  ctx.clearRect(0,0,W,H);

  // BG
  if(renderer.bgEnabled){
    const grd = ctx.createRadialGradient(W/2,H*.3,0,W/2,H*.3,H*.8);
    grd.addColorStop(0,'#1a0a2e'); grd.addColorStop(.5,'#0d0818'); grd.addColorStop(1,'#050308');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  }

  // Lane setup
  const LANES = 16;
  const laneW = W / (LANES + 2);  // padding on sides
  const offsetX = laneW;
  const trackW = W - offsetX*2;
  const laneUnit = trackW / LANES;

  // Hit line
  const hitY = H * 0.88;

  // Beats visible on screen (hiSpeed controls how many beats fit)
  const visibleBeats = (BEATS_PER_MEASURE * 4) / renderer.hiSpeed;

  // Lane backgrounds
  for(let i=0;i<LANES;i++){
    const x = offsetX + i*laneUnit;
    ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,.018)' : 'rgba(255,255,255,.008)';
    ctx.fillRect(x,0,laneUnit,H);
    // Lane border
    ctx.strokeStyle = 'rgba(255,255,255,.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  // Right border
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(offsetX+trackW,0); ctx.lineTo(offsetX+trackW,H); ctx.stroke();

  // Measure lines
  if(renderer.showMeasureLines){
    const curMeasure = Math.floor(renderer.currentBeat / BEATS_PER_MEASURE);
    for(let m=curMeasure-1; m<=curMeasure+6; m++){
      if(m<0||m>=TOTAL_MEASURES) continue;
      const beatDiff = m*BEATS_PER_MEASURE - renderer.currentBeat;
      const y = hitY - (beatDiff / visibleBeats) * hitY;
      if(y<0||y>H) continue;
      ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth=1;
      ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(offsetX,y); ctx.lineTo(offsetX+trackW,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font='bold 10px monospace';
      ctx.fillText('M'+(m+1), offsetX-28, y+4);
      // Beat subdivisions
      for(let b=1;b<4;b++){
        const subBeat = m*BEATS_PER_MEASURE + b*48 - renderer.currentBeat;
        const subY = hitY - (subBeat / visibleBeats) * hitY;
        if(subY<0||subY>H) continue;
        ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=.5;
        ctx.beginPath(); ctx.moveTo(offsetX,subY); ctx.lineTo(offsetX+trackW,subY); ctx.stroke();
      }
    }
  }

  // Draw notes
  for(const note of NOTES){
    const beatDiff = note.beat - renderer.currentBeat;
    const y = hitY - (beatDiff / visibleBeats) * hitY;
    const endY = hitY - ((note.beat+note.dur) - renderer.currentBeat) / visibleBeats * hitY;

    // Off screen check
    if(y < -200 || endY > H+200) continue;

    let lane = renderer.mirror ? (LANES - note.lane - note.w) : note.lane;
    const x = offsetX + lane * laneUnit;
    const nw = note.w * laneUnit;

    if(note.type === 'hold' && note.dur > 0){
      // Hold body
      const bodyTop = Math.min(y, endY);
      const bodyH = Math.abs(y - endY);
      const grd = ctx.createLinearGradient(x,bodyTop,x,bodyTop+bodyH);
      grd.addColorStop(0,'rgba(176,77,255,.5)'); grd.addColorStop(1,'rgba(176,77,255,.1)');
      ctx.fillStyle=grd; ctx.fillRect(x+2, bodyTop, nw-4, bodyH);
      ctx.strokeStyle='rgba(176,77,255,.4)'; ctx.lineWidth=1;
      ctx.strokeRect(x+2, bodyTop, nw-4, bodyH);
    }

    if(note.type==='slide'){
      const slGrd = ctx.createLinearGradient(x,0,x+nw,0);
      slGrd.addColorStop(0,'rgba(255,111,0,.85)'); slGrd.addColorStop(1,'rgba(176,77,255,.85)');
      drawNote(ctx, x, y, nw, 10, slGrd, 'rgba(176,77,255,.6)', '#7a3ce0');
    } else if(note.type==='tap'){
      drawNote(ctx, x, y, nw, 10, '#ff9040','rgba(255,130,0,.5)','#ff6000');
    } else if(note.type==='hold'){
      drawNote(ctx, x, y, nw, 10, '#d59fff','rgba(176,77,255,.6)','#7d3c98');
    } else if(note.type==='air'){
      // Triangle pointing up
      drawAir(ctx, x, y, nw);
    } else if(note.type==='flick'){
      drawNote(ctx, x, y, nw, 10, '#ff3daa','rgba(255,61,170,.5)','#cc0077');
      // Flick arrows
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
      ctx.fillText('◄ ►', x+nw/2, y-3);
    }
  }

  // Hit line
  const hlGrd = ctx.createLinearGradient(offsetX,hitY,offsetX+trackW,hitY);
  hlGrd.addColorStop(0,'rgba(255,111,0,0)'); hlGrd.addColorStop(.5,'rgba(255,111,0,.9)'); hlGrd.addColorStop(1,'rgba(255,111,0,0)');
  ctx.strokeStyle = hlGrd; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(offsetX,hitY); ctx.lineTo(offsetX+trackW,hitY); ctx.stroke();
  // Hit line glow
  ctx.shadowColor='rgba(255,111,0,.8)'; ctx.shadowBlur=12;
  ctx.strokeStyle='rgba(255,180,80,.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(offsetX,hitY); ctx.lineTo(offsetX+trackW,hitY); ctx.stroke();
  ctx.shadowBlur=0;

  // Bottom vignette
  const vgrd = ctx.createLinearGradient(0,H-60,0,H);
  vgrd.addColorStop(0,'rgba(0,0,0,0)'); vgrd.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=vgrd; ctx.fillRect(0,H-60,W,60);
}

function drawNote(ctx, x, y, w, h, fill, glow, border){
  const r = 3;
  ctx.shadowColor = glow; ctx.shadowBlur = 10;
  if(typeof fill === 'string' && fill.startsWith('#')||fill.startsWith('rgb')){
    ctx.fillStyle=fill;
  } else { ctx.fillStyle=fill; }
  roundRect(ctx, x+1, y-h/2, w-2, h, r);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=border; ctx.lineWidth=1.5;
  roundRect(ctx, x+1, y-h/2, w-2, h, r);
  ctx.stroke();
  // Shine
  const shine = ctx.createLinearGradient(x,y-h/2,x,y+h/2);
  shine.addColorStop(0,'rgba(255,255,255,.35)'); shine.addColorStop(.5,'rgba(255,255,255,.1)'); shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=shine;
  roundRect(ctx, x+1, y-h/2, w-2, h/2, r);
  ctx.fill();
}

function drawAir(ctx, x, y, w){
  const cx = x + w/2;
  const h = 14;
  ctx.shadowColor='rgba(61,228,255,.8)'; ctx.shadowBlur=12;
  ctx.fillStyle='rgba(61,228,255,.9)';
  ctx.beginPath(); ctx.moveTo(cx, y-h); ctx.lineTo(x+w-2, y+2); ctx.lineTo(x+2, y+2); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#00c8e8'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx, y-h); ctx.lineTo(x+w-2, y+2); ctx.lineTo(x+2, y+2); ctx.closePath(); ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

// ══════════════════════════════════════════
// 3D RENDER (perspective warp on the 2D canvas)
// ══════════════════════════════════════════
function draw3d(){
  const W = canvas3d.width, H = canvas3d.height;
  const ctx = ctx3d;
  ctx.clearRect(0,0,W,H);

  // Draw same content but with vertical stretch
  const LANES = 16;
  const trackW = W * 0.8;
  const offsetX = W * 0.1;
  const laneUnit = trackW / LANES;
  const hitY = H * 0.82;
  const visibleBeats = (BEATS_PER_MEASURE * 4) / renderer.hiSpeed;

  // BG gradient (sky effect)
  if(renderer.bgEnabled){
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#050310'); grd.addColorStop(.5,'#0d0820'); grd.addColorStop(1,'#1a0a2e');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  }

  // Perspective lane lines
  const vanishY = H * 0.25;
  for(let i=0;i<=LANES;i++){
    const botX = offsetX + i*laneUnit;
    const topX = W/2 + (botX - W/2) * 0.1;
    ctx.strokeStyle = i%4===0 ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.07)';
    ctx.lineWidth = i%4===0 ? 1.5 : .5;
    ctx.beginPath(); ctx.moveTo(botX, hitY); ctx.lineTo(topX, vanishY); ctx.stroke();
  }
  // Horizontal grid lines (perspective)
  const hLines = 16;
  for(let j=0;j<=hLines;j++){
    const t = j/hLines;
    const y = hitY - (hitY - vanishY) * Math.pow(t, 0.6);
    const xL = W/2 + (offsetX - W/2) * (1 - t + t*0.1);
    const xR = W/2 + (offsetX+trackW - W/2) * (1 - t + t*0.1);
    ctx.strokeStyle = j%4===0 ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.05)';
    ctx.lineWidth = .5;
    ctx.beginPath(); ctx.moveTo(xL,y); ctx.lineTo(xR,y); ctx.stroke();
  }

  // Floor highlight
  const floorGrd = ctx.createLinearGradient(0,H*.7,0,H);
  floorGrd.addColorStop(0,'rgba(255,111,0,0)'); floorGrd.addColorStop(1,'rgba(255,111,0,.08)');
  ctx.fillStyle=floorGrd; ctx.fillRect(0,H*.7,W,H*.3);

  // Draw notes with perspective
  for(const note of NOTES){
    const beatDiff = note.beat - renderer.currentBeat;
    if(beatDiff < -12 || beatDiff > visibleBeats) continue;
    const t = Math.max(0, Math.min(1, beatDiff / visibleBeats));

    let lane = renderer.mirror ? (LANES - note.lane - note.w) : note.lane;
    const botX = offsetX + lane*laneUnit;
    const botW = note.w * laneUnit;

    // Perspective projection
    const py = hitY - (hitY - vanishY) * Math.pow(t, 0.6);
    const scale3d = 1 - t * 0.9;
    const projX = W/2 + (botX - W/2) * scale3d;
    const projW = botW * scale3d;
    const noteH = 6 * scale3d;

    if(note.type==='hold'&&note.dur>0){
      const t2 = Math.max(0,Math.min(1,(note.beat+note.dur-renderer.currentBeat)/visibleBeats));
      const py2 = hitY - (hitY-vanishY)*Math.pow(t2,.6);
      const sc2 = 1 - t2*.9;
      const px2 = W/2+(botX-W/2)*sc2, pw2=botW*sc2;
      ctx.fillStyle='rgba(176,77,255,.3)';
      ctx.beginPath(); ctx.moveTo(projX,py); ctx.lineTo(projX+projW,py); ctx.lineTo(px2+pw2,py2); ctx.lineTo(px2,py2); ctx.closePath(); ctx.fill();
    }

    let col = '#ff9040';
    if(note.type==='hold') col='#d59fff';
    else if(note.type==='air') col='#3de4ff';
    else if(note.type==='flick') col='#ff3daa';
    else if(note.type==='slide') col='#b04dff';

    ctx.shadowColor=col; ctx.shadowBlur=8*scale3d;
    ctx.fillStyle=col;
    roundRect(ctx, projX, py-noteH/2, projW, noteH, 2*scale3d); ctx.fill();
    ctx.shadowBlur=0;
  }

  // Hit line (glow)
  const hlGrd = ctx.createLinearGradient(offsetX,hitY,offsetX+trackW,hitY);
  hlGrd.addColorStop(0,'rgba(255,111,0,0)'); hlGrd.addColorStop(.5,'rgba(255,111,0,1)'); hlGrd.addColorStop(1,'rgba(255,111,0,0)');
  ctx.strokeStyle=hlGrd; ctx.lineWidth=4;
  ctx.shadowColor='rgba(255,111,0,.8)'; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.moveTo(offsetX,hitY); ctx.lineTo(offsetX+trackW,hitY); ctx.stroke();
  ctx.shadowBlur=0;
}

// ══════════════════════════════════════════
// ANIMATION LOOP
// ══════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);
  if(renderer.playing && renderer.lastTime !== null){
    const dt = (ts - renderer.lastTime) / 1000;
    renderer.currentBeat += dt * bps() * renderer.speed;
    if(renderer.currentBeat >= TOTAL_BEATS){ renderer.currentBeat=0; }
  }
  renderer.lastTime = ts;

  // FPS
  renderer.frameCount++;
  renderer.fpsTimer += 1;
  if(renderer.frameCount%30===0){
    document.getElementById('fpsDisplay').textContent = Math.round(1000/(ts/renderer.frameCount||16)) + ' fps';
  }

  // Draw
  if(renderer.view==='2d') draw2d();
  else { draw2d(); draw3d(); }

  // Update UI
  const frac = renderer.currentBeat / TOTAL_BEATS;
  document.getElementById('seekBar').value = Math.round(frac*1000);
  const totalSecs = (TOTAL_BEATS / bps());
  const nowSecs = frac * totalSecs;
  document.getElementById('timeNow').textContent = fmt(nowSecs);
  const measure = Math.floor(renderer.currentBeat/BEATS_PER_MEASURE)+1;
  document.getElementById('currentMeasure').textContent = measure;
  updateMeasureMarkers(measure);
}
requestAnimationFrame(loop);

function fmt(s){ const m=Math.floor(s/60); return m+':'+(Math.floor(s%60)).toString().padStart(2,'0'); }

// ══════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════
function togglePlay(){
  renderer.playing = !renderer.playing;
  document.getElementById('playBtn').textContent = renderer.playing ? '⏸' : '▶';
  document.getElementById('pauseOverlay').classList.toggle('show', !renderer.playing);
}
function onSeek(val){
  renderer.currentBeat = (val/1000) * TOTAL_BEATS;
}
function skipTime(secs){
  renderer.currentBeat += secs * bps();
  renderer.currentBeat = Math.max(0, Math.min(TOTAL_BEATS-1, renderer.currentBeat));
}
const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5];
let speedIdx = 3;
function setSpeed(s){
  renderer.speed = s;
  speedIdx = SPEEDS.indexOf(s);
  if(speedIdx<0) speedIdx=3;
  document.getElementById('speedDisplay').textContent = s.toFixed(2)+'×';
  document.querySelectorAll('.speed-btn').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.speed)===s);
  });
}
function cycleSpeed(){
  speedIdx = (speedIdx+1)%SPEEDS.length;
  setSpeed(SPEEDS[speedIdx]);
}
function updateHiSpeed(v){
  renderer.hiSpeed = parseFloat(v);
  document.getElementById('hsVal').textContent = '×'+parseFloat(v).toFixed(1);
}
function setView(v){
  renderer.view = v;
  document.getElementById('view2d').classList.toggle('active', v==='2d');
  document.getElementById('view3d').classList.toggle('active', v==='3d');
  document.getElementById('canvas3dWrap').classList.toggle('show', v==='3d');
  document.getElementById('canvasWrap').style.background = v==='3d'?'transparent':'#000';
}
function toggleBg(on){ renderer.bgEnabled=on; }
function jumpToMeasure(){
  const m = parseInt(document.getElementById('measureJumpInput').value)||1;
  renderer.currentBeat = Math.max(0, Math.min(TOTAL_BEATS-1, (m-1)*BEATS_PER_MEASURE));
}

// ── Panel toggle ──
let panelVisible = true;
function togglePanel(){
  panelVisible = !panelVisible;
  document.getElementById('rightPanel').classList.toggle('hidden', !panelVisible);
  document.getElementById('canvasWrap').classList.toggle('panel-hidden', !panelVisible);
  document.getElementById('panelToggleBtn').classList.toggle('active', panelVisible);
}

// ── Fullscreen ──
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else { document.exitFullscreen(); }
}

// ── Measure list ──
const BOOKMARKS = [
  {m:1, label:'イントロ'},
  {m:9, label:'Aメロ'},
  {m:17,label:'サビ①'},
  {m:25,label:'手速段落'},
  {m:33,label:'Bメロ'},
  {m:41,label:'サビ②'},
  {m:57,label:'発狂配置'},
  {m:65,label:'ラスサビ'},
  {m:113,label:'アウトロ'},
];
function buildMeasureList(){
  const el = document.getElementById('measureList');
  el.innerHTML = BOOKMARKS.map((b,i)=>`
    <div class="measure-marker" id="mm${b.m}" onclick="jumpToMeasureN(${b.m})">
      <span class="m-num">M${b.m}</span>
      <div class="m-bar"><div class="m-bar-fill" style="width:${(b.m/TOTAL_MEASURES*100).toFixed(1)}%"></div></div>
      <span class="m-label">${b.label}</span>
    </div>
  `).join('');
}
function jumpToMeasureN(m){ renderer.currentBeat = (m-1)*BEATS_PER_MEASURE; }
function updateMeasureMarkers(cur){
  BOOKMARKS.forEach(b=>{
    const el=document.getElementById('mm'+b.m);
    if(el) el.classList.toggle('current', cur>=b.m && cur<(BOOKMARKS[BOOKMARKS.indexOf(b)+1]?.m||999));
  });
}
buildMeasureList();

// ── Build measure ticks ──
function buildTicks(){
  const container = document.getElementById('measureTicks');
  container.innerHTML='';
  const W = container.clientWidth||600;
  const keyMeasures = [1,9,17,25,33,41,49,57,65,73,81,89,97,105,113,121,128];
  keyMeasures.forEach(m=>{
    const pct = (m-1)/(TOTAL_MEASURES-1)*100;
    const tick = document.createElement('div');
    tick.className='tick beat';
    tick.style.left=pct+'%';
    container.appendChild(tick);
    const label=document.createElement('div');
    label.className='tick-label';
    label.style.left=pct+'%';
    label.textContent='M'+m;
    container.appendChild(label);
  });
}
buildTicks();

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft') skipTime(-5);
  if(e.code==='ArrowRight') skipTime(5);
  if(e.code==='KeyM') document.getElementById('mirrorToggle').click();
  if(e.code==='KeyF') toggleFullscreen();
  if(e.code==='KeyP') togglePanel();
});

// Auto-start hint
setTimeout(()=>{
  if(!renderer.playing){
    ctx2d.fillStyle='rgba(255,255,255,.6)';
    ctx2d.font='bold 16px sans-serif'; ctx2d.textAlign='center';
    ctx2d.fillText('按 Space 或點擊 ▶ 開始播放', canvas2d.width/2, canvas2d.height/2);
  }
},300);

    <button class="icon-btn" data-oauth="discord" onclick="loginWithDiscord()" style="margin:10px 0;border-color:#5865F2;">以 Discord 帳號登入</button>

</div>
