<!-- ============================================================
  大份吧 — 通用登入 Modal 片段
  複製此段到每個 HTML 頁面的 </body> 前
  並在 <head> 加入：
    <script type="module" src="js/auth.js"></script>
============================================================ -->

<!-- Login Modal -->
<div id="loginModal" style="
  display:none;position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;
" onclick="if(event.target===this)closeLoginModal()">
  <div style="
    background:#13131f;border:1px solid #3a3a60;border-radius:20px;
    padding:40px 36px;width:90%;max-width:400px;text-align:center;
    box-shadow:0 0 40px rgba(255,111,0,.2);animation:mIn .25s ease;
  ">
    <style>@keyframes mIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}</style>
    <div style="font-size:40px;margin-bottom:12px;">👾</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:8px;color:#eaeaf0;">加入大份吧</h2>
    <p style="color:#8888aa;font-size:14px;margin-bottom:28px;">使用第三方帳號快速登入，無需密碼</p>

    <!-- 錯誤訊息 -->
    <div id="authError" style="display:none;color:#ef4444;font-size:13px;margin-bottom:12px;
      background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
      border-radius:8px;padding:8px 14px;"></div>

    <!-- Discord -->
    <button data-oauth="discord" onclick="loginWithDiscord()" style="
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:14px 20px;border-radius:10px;
      border:1px solid #3a3a60;background:#1a1a2e;color:#eaeaf0;
      font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;
      transition:all .2s;
    " onmouseover="this.style.borderColor='#5865F2'" onmouseout="this.style.borderColor='#3a3a60'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#5865F2">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      以 Discord 帳號登入
    </button>

    <!-- Google -->
    <button data-oauth="google" onclick="loginWithGoogle()" style="
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:14px 20px;border-radius:10px;
      border:1px solid #3a3a60;background:#1a1a2e;color:#eaeaf0;
      font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;
      transition:all .2s;
    " onmouseover="this.style.borderColor='#4285F4'" onmouseout="this.style.borderColor='#3a3a60'">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      以 Google 帳號登入
    </button>

    <button onclick="closeLoginModal()" style="
      background:none;border:none;color:#55556a;font-size:13px;cursor:pointer;margin-top:8px;
    ">取消，稍後再說</button>
  </div>
</div>
